pool:
  vmImage: ubuntu-latest

trigger:
  branches:
    include:
      - main

variables:
  DevSubscription: 's268d.azdo.deployment'
  TestSubscription: 's268t.azdo.deployment'
  UATSubscription: 's268t.azdo.deployment'
  PreProdSubscription: 's268t.azdo.deployment'
  ProdSubscription: 's268p.azdo.deployment'

stages:
  - template: job-templates/build.yml

  - stage: DeployToDev
    displayName: Deploy to Dev
    #condition: and(
    #  succeeded(),
    #  ne(variables['Build.Reason'], 'PullRequest'),
    #  eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - S268Dev'
      - group: 'Alert Thresholds - Dev'
    jobs:
      - template: job-templates/deploy.yml
        parameters:
          Environment: dev
          EnvironmentDisplayName: Dev
          AzureSubscription: ${{ variables.DevSubscription }}

  - stage: RunE2ETests
    displayName: 'Run E2E Tests'
    dependsOn: DeployToDev
    #condition: and(
    #  succeeded(),
    #  ne(variables['Build.Reason'], 'PullRequest'),
    #  eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - S268Dev'
      - group: 'Test Automation - Dev'
    jobs:
      - template: job-templates/run-e2e-tests.yml
        parameters:
          ProjectPath: 'tests/SchoolAccount.Web.Connect.E2ETests/PlaywrightTests.DfE.Tests.csproj'
          BuildConfiguration: 'release'
          AzureSubscription: ${{ variables.DevSubscription }}

  - stage: DeployToTest
    displayName: Deploy to Test
    condition: and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - S268Test'
      - group: 'Alert Thresholds - Test'
    jobs:
      - template: job-templates/deploy.yml
        parameters:
          Environment: test
          EnvironmentDisplayName: Test
          AzureSubscription: ${{ variables.TestSubscription }}

  - stage: DeployToUAT
    displayName: Deploy to UAT
    condition: and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - S268UAT'
      - group: 'Alert Thresholds - UAT'
    jobs:
      - template: job-templates/deploy.yml
        parameters:
          Environment: uat
          EnvironmentDisplayName: UAT
          AzureSubscription: ${{ variables.UATSubscription }}

  - stage: DeployToPreProd
    displayName: Deploy to PreProd
    condition: and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - S268PreProd'
      - group: 'Alert Thresholds - PreProd'
    jobs:
      - template: job-templates/deploy.yml
        parameters:
          Environment: pp
          EnvironmentDisplayName: PreProd
          AzureSubscription: ${{ variables.PreProdSubscription }}

  - stage: DeployToProd
    displayName: Deploy to Prod
    condition: and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - Prod'
      - group: 'Alert Thresholds - Prod'
    jobs:
      - template: job-templates/deploy.yml
        parameters:
          Environment: pd
          EnvironmentDisplayName: Prod
          AzureSubscription: ${{ variables.ProdSubscription }}
