pool:
  vmImage: ubuntu-latest

trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: ServiceNowScripts
      type: git
      name: SchoolAccount-ServiceNow
      ref: refs/heads/main

variables:
  - group: 'Shared Resources - S268Dev'
  - group: 'Shared Resources - S268PreProd'
  - group: 'Shared Resources - S268Prod'

stages:
  - template: job-templates/build.yml

  - stage: DeployToDev
    displayName: Deploy to Dev
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - S268Dev'
      - group: 'Alert Thresholds - Dev'
    jobs:
      - template: job-templates/deploy.yml
        parameters:
          Environment: dev
          EnvironmentDisplayName: Dev

  - stage: DeployToPreProd
    displayName: Deploy to PreProd
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - S268PreProd'
      - group: 'Alert Thresholds - PreProd'
    jobs:
      - template: job-templates/deploy.yml
        parameters:
          Environment: pp
          EnvironmentDisplayName: PreProd

  - stage: DeployToProd
    displayName: Deploy to Prod
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: 'Shared Resources - S268Prod'
      - group: 'Alert Thresholds - Prod'
      - group: 'Service Now - Production'
    jobs:
      - template: job-templates/deploy-with-servicenow.yml
        parameters:
          Environment: pd
          EnvironmentDisplayName: Prod