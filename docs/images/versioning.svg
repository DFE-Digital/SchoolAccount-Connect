<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" rx="24" fill="#ffffff"/>

  <text x="500" y="70" text-anchor="middle" font-size="13" letter-spacing="2" font-weight="600" fill="#86868b">VERSION</text>

  <!-- the version string, monospace for predictable spacing, start x=296, charW=24, baseline y=140 -->
  <g font-family="'SF Mono', Menlo, monospace" font-size="40" font-weight="500">
    <text x="296" y="140" fill="#1d1d1f" xml:space="preserve">2026</text>
    <text x="392" y="140" fill="#c7c7cc">.</text>
    <text x="416" y="140" fill="#1d1d1f">6</text>
    <text x="440" y="140" fill="#c7c7cc">.</text>
    <text x="464" y="140" fill="#1d1d1f">3</text>
    <text x="488" y="140" fill="#c7c7cc">+</text>
    <text x="512" y="140" fill="#0071e3">abc12345</text>
  </g>

  <!-- connectors and labels -->
  <g stroke="#d2d2d7" stroke-width="1.3">
    <line x1="344" y1="156" x2="344" y2="196"/>
    <line x1="428" y1="156" x2="428" y2="196"/>
    <line x1="476" y1="156" x2="476" y2="236"/>
    <line x1="608" y1="156" x2="608" y2="196"/>
  </g>

  <text x="344" y="214" text-anchor="middle" font-size="12.5" letter-spacing="1" font-weight="600" fill="#6e6e73">YEAR</text>
  <text x="428" y="214" text-anchor="middle" font-size="12.5" letter-spacing="1" font-weight="600" fill="#6e6e73">MONTH</text>

  <text x="476" y="254" text-anchor="middle" font-size="12.5" letter-spacing="1" font-weight="600" fill="#6e6e73">REVISION</text>
  <text x="476" y="272" text-anchor="middle" font-size="11" fill="#a1a1a6">commits this month &#183; resets monthly</text>

  <text x="608" y="214" text-anchor="middle" font-size="12.5" letter-spacing="1" font-weight="600" fill="#0071e3">COMMIT</text>
  <text x="608" y="232" text-anchor="middle" font-size="11" fill="#a1a1a6">8-bit git SHA</text>
</svg>
