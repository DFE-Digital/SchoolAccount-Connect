<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" rx="24" fill="#ffffff"/>

  <text x="60" y="62" font-size="13" letter-spacing="2" font-weight="600" fill="#86868b">CREDENTIALS</text>

  <!-- BUILD column -->
  <rect x="60" y="86" width="270" height="220" rx="18" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.3"/>
  <text x="84" y="122" font-size="16" font-weight="600" fill="#1d1d1f">Build</text>
  <text x="84" y="160" font-size="13" fill="#6e6e73">Buld &amp; Push &#8594; GHCR</text>
  <circle cx="90" cy="182" r="4.5" fill="#34c759"/>
  <text x="104" y="187" font-size="13" font-weight="500" fill="#1d1d1f">GITHUB_TOKEN</text>
  <text x="104" y="205" font-size="11.5" fill="#a1a1a6">ephemeral, per run</text>
  <text x="84" y="240" font-size="13" fill="#6e6e73">Restore NuGet</text>
  <circle cx="90" cy="262" r="4.5" fill="#ff9f0a"/>
  <text x="104" y="267" font-size="13" font-weight="500" fill="#1d1d1f">PAT</text>
  <text x="104" y="285" font-size="11.5" fill="#a1a1a6">Repository secret &#8594; OIDC token (P)</text>

  <!-- DEPLOY column -->
  <rect x="365" y="86" width="270" height="220" rx="18" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.3"/>
  <text x="389" y="122" font-size="16" font-weight="600" fill="#1d1d1f">Deploy</text>
  <text x="389" y="160" font-size="13" fill="#6e6e73">GHCR &#8594; ACR</text>
  <circle cx="395" cy="182" r="4.5" fill="#ff9f0a"/>
  <text x="409" y="187" font-size="13" font-weight="500" fill="#1d1d1f">AZURE_CREDENTIALS</text>
  <text x="409" y="205" font-size="11.5" fill="#a1a1a6">Repository secret &#8594; OIDC token (P)</text>
  <text x="389" y="240" font-size="13" fill="#6e6e73">Per environment</text>
  <circle cx="395" cy="262" r="4.5" fill="#34c759"/>
  <text x="409" y="267" font-size="13" font-weight="500" fill="#1d1d1f">Scoped identity</text>
  <text x="409" y="285" font-size="11.5" fill="#a1a1a6">dev / prod separate</text>

  <!-- RUN column -->
  <rect x="670" y="86" width="270" height="220" rx="18" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.3"/>
  <text x="694" y="122" font-size="16" font-weight="600" fill="#1d1d1f">Run</text>
  <text x="694" y="160" font-size="13" fill="#6e6e73">Terraform Configuration</text>
  <circle cx="700" cy="182" r="4.5" fill="#34c759"/>
  <text x="714" y="187" font-size="13" font-weight="500" fill="#1d1d1f">Azure Insights &amp; App Connection</text>
  <text x="714" y="205" font-size="13" font-weight="500" fill="#1d1d1f">Variables</text>
  <text x="714" y="228" font-size="11.5" fill="#a1a1a6">Required to allow app to be code</text>
  <text x="714" y="242" font-size="11.5" fill="#a1a1a6">configured</text>

  <!-- legend -->
  <circle cx="66" cy="350" r="4.5" fill="#34c759"/>
  <text x="80" y="355" font-size="12.5" fill="#6e6e73">Valid/Complete Step</text>
  <circle cx="246" cy="350" r="4.5" fill="#ff9f0a"/>
  <text x="260" y="355" font-size="12.5" fill="#6e6e73">To be tweaked as secrets need monitoring</text>
</svg>
