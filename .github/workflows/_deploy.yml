name: Deploy to Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image-tag:
        required: true
        type: string
    outputs:
      app-url:
        description: "Public URL of the deployed Container App"
        value: ${{ jobs.deploy.outputs.app-url }}

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write 
      contents: read
    outputs:
      app-url: ${{ steps.tf-output.outputs.app-url }}
    steps:
      - uses: actions/checkout@v5
      
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Terraform Init
        working-directory: terraform/environments/${{ inputs.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init
      
      - name: Terraform Apply
        working-directory: terraform/environments/${{ inputs.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_container_image: ghcr.io/dfe-digital/schoolaccount-alpha-app:${{ inputs.image-tag }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PULL_PAT }}
        run: terraform apply -auto-approve

      - name: Capture app URL
        id: tf-output
        working-directory: terraform/environments/${{ inputs.environment }}
        run: echo "app-url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
 