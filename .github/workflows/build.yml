name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/github-actions']
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Test Image
    uses: ./.github/workflows/_test.yml
    with:
      dotnet-version: '10.0.x'

  build:
    name: Build & Push Image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    outputs:
      image-tag: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: echo "image=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SchoolAccount.Web.Connect/Dockerfile
          target: final
          secrets: |
            personal_access_token=${{ secrets.AZURE_DEVOPS_PAT }}
          push: true
          tags: ghcr.io/dfe-digital/schoolaccount-connect:${{ steps.tag.outputs.image }}

  deploy-dev:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit

  deploy-prod:
    needs: [build, deploy-dev]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit