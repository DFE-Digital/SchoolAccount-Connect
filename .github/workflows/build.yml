name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/github-actions']
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_NAME: 'schoolaccount-connect'

jobs:
  tests:
    uses: ./.github/workflows/_test.yml
    with:
      dotnet-version: ${{ env.DOTNET_VERSION }}

  build:
    name: Build & Push Image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "image-tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SchoolAccount.Web.Connect/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/dfe-digital/${{ env.PROJECT_NAME }}:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-dev:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit

  deploy-prod:
    needs: [build, deploy-dev]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image-tag: ${{ needs.build.outputs.image-tag }}
    secrets: inherit