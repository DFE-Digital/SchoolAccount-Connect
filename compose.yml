name: schoolaccount
services:
  connect:
    hostname: schoolaccount-connect
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      AzureAppConfiguration__Endpoint: "Endpoint=http://app-config-emulator:8483;Id=emulator-test-id;Secret=abcdefghijklmnopqrstuvwxyz1234567890"
      ConnectionStrings__SchoolAccount: "Server=schoolaccount-database,1433;Initial Catalog=sa-sql-db-dev;User ID=sa;Password=MyStrongPassword123!;TrustServerCertificate=True;Connection Timeout=30;"
      Kestrel__Endpoints__Https__Url: "https://*:7034"
      Kestrel__Endpoints__Https__Certificate__Path: "/https/connect.pem"
      Kestrel__Endpoints__Https__Certificate__KeyPath: "/https/connect-key.pem"
    build:
      context: .
      dockerfile: ./src/SchoolAccount.Web.Connect/Dockerfile
      target: debug
      secrets:
        - personal_access_token
    depends_on:
      - database
      - migrations
      - app-config-emulator
      - seq
    ports:
      - "7034:7034"
    networks:
      - default
    volumes:
      - ./certs/:/https:ro      
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys

  database:
    hostname: schoolaccount-database
    platform: linux/amd64
    build:
      context: ../SchoolAccount-Database/src/SchoolAccount.Database/sql-server/
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_SQLCMD_PATH=${MSSQL_SQLCMD_PATH}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    user: root
    volumes:
      - database-data:/var/opt/mssql
    healthcheck:
      test: ${MSSQL_SQLCMD_PATH} -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - default

  migrations:
    image: flyway/flyway:latest
    environment:
      - FLYWAY_PASSWORD=${MSSQL_SA_PASSWORD}
    command: migrate
    volumes:
      - ../SchoolAccount-Database/src/SchoolAccount.Database/flyway/conf:/flyway/conf
      - ../SchoolAccount-Database/src/SchoolAccount.Database/flyway/migrations:/flyway/migrations
      - ../SchoolAccount-Database/src/SchoolAccount.Database/flyway/repeatable:/flyway/repeatable
      - ../SchoolAccount-Database/src/SchoolAccount.Database/flyway/callbacks:/flyway/callbacks
      - ../SchoolAccount-Database/src/SchoolAccount.Database/flyway/seed:/flyway/seed
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
  
  app-config-emulator:
    hostname: app-config-emulator
    platform: linux/amd64
    image: mcr.microsoft.com/azure-app-configuration/app-configuration-emulator:1.0.2
    ports:
      - "8483:8483"
    environment:
      - Tenant:AnonymousAuthEnabled=true
      - Tenant:HmacSha256Enabled=true
      - Tenant:AccessKeys:0:Id=emulator-test-id
      - Tenant:AccessKeys:0:Secret=abcdefghijklmnopqrstuvwxyz1234567890
      - Authentication:Anonymous:AnonymousUserRole=Owner
    networks:
      - default
    volumes:
      - ../SchoolAccount-LocalDevTools/config/azure-app-config:/app/.aace
  
  seq:
    hostname: seq
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - default

networks:
  default:
    name: db-network
    driver: bridge

secrets:
  personal_access_token:
    environment: 'DEV_PAT'

volumes:
  database-data:
  seq-data:
  dataprotection-keys:
